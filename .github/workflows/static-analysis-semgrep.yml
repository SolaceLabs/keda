name: "Semgrep"

on:
  push:
    branches: [ "main" ]
  pull_request_target: {}

jobs:
  semgrep:
    name: Analyze Semgrep
    runs-on: ubuntu-latest
    container: returntocorp/semgrep
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Register workspace path
        if: ${{ github.event.number > 0 }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: checkout
        if: ${{ github.event.number > 0 }}
        run: |
          apk add github-cli
          gh pr checkout ${{ github.event.number }}

      - run: semgrep ci --sarif --output=semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF file for GitHub Advanced Security Dashboard
        uses: github/codeql-action/upload-sarif@b8d3b6e8af63cde30bdc382c0bc28114f4346c88 # v2
        with:
          sarif_file: semgrep.sarif
        if: ${{ github.event.number == '' && !cancelled() }}
